<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F5F1E8">
<title>觀戰簿</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Noto+Serif+TC:wght@700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5F1E8; --surface:#FFFDF8; --ink:#1F1B16; --muted:#6E665A; --faint:#A39B8E; --line:#E3DCCC; --chip:#ECE6D8;
  --win:#2F6B45; --loss:#B23A2E; --tie:#8A8273; --team:#C8102E; --sel:#D9A21B;
  --serif:"DM Serif Display","Noto Serif TC","Songti TC",serif;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#141210; --surface:#1E1B18; --ink:#F1ECE2; --muted:#A69D90; --faint:#6A6258; --line:#322D27; --chip:#2A2622;
    --win:#5DAA78; --loss:#E0705E; --tie:#A39A8B; --sel:#F0C23A;
  }
}
:root[data-theme="dark"]{
  --bg:#141210; --surface:#1E1B18; --ink:#F1ECE2; --muted:#A69D90; --faint:#6A6258; --line:#322D27; --chip:#2A2622;
  --win:#5DAA78; --loss:#E0705E; --tie:#A39A8B; --sel:#F0C23A;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent;padding-bottom:84px}
body.has-bar{padding-bottom:150px}
.num{font-family:var(--serif);font-variant-numeric:lining-nums tabular-nums;font-weight:400}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--sel);outline-offset:2px}
.hide{display:none!important}
.wrap{max-width:600px;margin:0 auto;padding:0 14px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:8px;padding:12px 14px 8px;max-width:600px;margin:0 auto}
.top h1{margin:0;font-family:var(--serif);font-size:24px;font-weight:700;flex:1}
.icon-btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;height:38px;min-width:38px;padding:0 12px;display:grid;place-items:center;font-size:14px}
.back{border:0;background:none;font-size:16px;color:var(--muted);padding:8px 4px}

/* badges */
.badge{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:7px;font-family:var(--sans);font-weight:700;font-size:14px;line-height:1;flex:none}
.badge.code{font-size:9px;letter-spacing:.02em}
.badge.dark{box-shadow:inset 0 0 0 1px rgba(255,255,255,.18)}
.badge.sm{width:17px;height:17px;border-radius:4px;font-size:10px}
.badge.lg{width:46px;height:46px;border-radius:12px;font-size:22px}
.badge.off{background:var(--chip)!important;color:var(--faint)!important;box-shadow:none}

/* segmented */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--chip);border-radius:12px;padding:3px;gap:3px}
.seg button{border:0;background:none;border-radius:9px;padding:8px 0;font-size:15px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.controls{display:grid;gap:8px;margin-bottom:12px}

.navrow{display:grid;grid-template-columns:40px 1fr 40px;align-items:center;gap:8px;margin:4px 0 10px}
.navrow button.arr{border:1px solid var(--line);background:var(--surface);border-radius:10px;height:40px;font-size:18px}
.navrow button.arr:disabled{opacity:.35}
.navtitle{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.navtitle b{font-family:var(--serif);font-weight:400;font-size:28px;line-height:1}
.navtitle span{font-size:13px;color:var(--muted)}
.navtitle em{font-style:normal;font-size:13px;color:var(--sel);font-weight:700}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 13px;font-size:14px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* month grid */
.dow,.mgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dow div{text-align:center;font-size:12px;color:var(--muted);padding:2px 0}
.mcell{min-height:64px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:3px 1px 4px;display:flex;flex-direction:column;align-items:center;gap:2px}
.mcell.none{background:none;border-style:dashed}
.mcell.blank{border:0;background:none}
.mcell.today{border-color:var(--ink)}
.mcell .d{font-size:12px;font-weight:700;line-height:1.3}
.mcell.none .d{color:var(--faint);font-weight:400}
.pair{display:flex;gap:2px;border:1.5px solid transparent;border-radius:6px;padding:1px;background:none}
.pair.sel{border-color:var(--sel)}
.mcell.hassel{box-shadow:inset 0 0 0 1.5px var(--sel)}
.mcnt{border:0;background:var(--chip);border-radius:6px;width:calc(100% - 4px);flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--serif);font-size:17px;line-height:1.1;color:var(--ink);padding:2px 0}
.mcnt small{font-family:var(--sans);font-size:10px;color:var(--muted)}
.mcnt em{font-style:normal;font-family:var(--sans);font-size:10px;font-weight:700;color:var(--sel)}

/* game cards */
.day{display:grid;grid-template-columns:54px 1fr;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.day-h b{display:block;font-family:var(--serif);font-weight:400;font-size:19px;line-height:1.1}
.day-h span{font-size:12px;color:var(--muted)}
.day-none{color:var(--faint);font-size:14px;align-self:center}
.gcards{display:grid;gap:6px}
.gcard{display:grid;grid-template-columns:auto 1fr auto 1fr auto;align-items:center;column-gap:6px;row-gap:1px;width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 9px;text-align:left}
.gcard.sel{border-color:var(--sel);box-shadow:0 0 0 1px var(--sel)}
.gcard .nm{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gcard .nm.r{text-align:right}
.gcard .nm.lose{color:var(--faint)}
.gcard .nm.win{font-weight:700}
.gcard .sc{font-family:var(--serif);font-size:19px;text-align:center;white-space:nowrap;padding:0 2px}
.gcard .sc i{font-style:normal;color:var(--faint);font-size:14px;padding:0 3px}
.gcard .meta{grid-column:1/-1;display:flex;justify-content:space-between;gap:8px;font-size:11px;color:var(--muted);margin-top:3px}
.gcard .meta span:last-child{text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mhead{display:flex;align-items:baseline;gap:10px;margin:22px 0 4px;padding-bottom:6px;border-bottom:2px solid var(--ink)}
.mhead b{font-family:var(--serif);font-weight:400;font-size:28px;line-height:1}
.mhead span{font-size:13px;color:var(--muted);flex:1;text-align:right}
.mhead em{font-style:normal;font-size:13px;color:var(--sel);font-weight:700}

/* selection bar */
.selbar{position:fixed;left:0;right:0;bottom:calc(58px + env(safe-area-inset-bottom,0px));z-index:9;padding:8px 14px;background:linear-gradient(to top,var(--bg) 70%,transparent)}
.selbar-in{max-width:600px;margin:0 auto;display:flex;align-items:center;gap:10px}
.selbar b{font-family:var(--serif);font-weight:400;font-size:30px;line-height:1}
.selbar span{font-size:13px;color:var(--muted);flex:1}
.selbar button{border:0;background:var(--ink);color:var(--bg);border-radius:999px;padding:12px 20px;font-weight:700;font-size:15px}

/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--bg);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav-in{max-width:600px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr)}
.nav button{border:0;background:none;padding:16px 0 14px;font-size:15px;color:var(--muted)}
.nav button[aria-current="true"]{color:var(--ink);font-weight:700}

/* sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:30}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;background:var(--surface);border-radius:18px 18px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));max-width:600px;margin:0 auto}
.sheet .meta{font-size:13px;color:var(--muted);text-align:center}
.sheet .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}

/* log list */
.hero{margin:6px 0 20px;padding:16px 16px 14px;background:var(--surface);border:1px solid var(--line);border-radius:4px 4px 16px 16px;border-top:6px solid var(--team)}
.hero-team{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--muted)}
.hero h2{font-family:var(--serif);font-weight:400;font-size:clamp(30px,9vw,42px);line-height:1.15;margin:10px 0 14px}
.hero h2 em{font-style:italic;color:var(--team)}
.stats-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(74px,1fr));gap:10px;border-top:1px solid var(--line);padding-top:12px}
.stats-row div{display:flex;flex-direction:column}
.stats-row b{font-family:var(--serif);font-weight:400;font-size:26px;line-height:1.1}
.stats-row span{font-size:12px;color:var(--muted)}
.up{color:var(--win)}.down{color:var(--loss)}
.dots{display:flex;flex-wrap:wrap;gap:5px;margin-top:14px}
.dot{width:12px;height:12px;border-radius:50%;border:1.5px solid var(--team)}
.dot.W{background:var(--team)}
.dot.T{background:linear-gradient(90deg,var(--team) 50%,transparent 50%)}
.legend{font-size:12px;color:var(--muted);margin-top:6px}
.subrec{font-size:13px;color:var(--muted);margin-top:8px;display:flex;flex-wrap:wrap;gap:6px 14px}
.subrec span{display:inline-flex;align-items:center;gap:6px}
.month{font-family:var(--serif);font-size:20px;margin:20px 0 6px;display:flex;align-items:baseline;gap:8px}
.month small{font-family:var(--sans);font-size:13px;color:var(--muted)}
.row{display:grid;grid-template-columns:46px 1fr 34px;grid-template-areas:"d s r" "d v v";align-items:center;column-gap:10px;row-gap:2px;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;padding:12px 2px}
.r-date{grid-area:d;font-family:var(--serif);font-size:22px;line-height:1;align-self:start;padding-top:4px}
.r-date small{display:block;font-family:var(--sans);font-size:11px;color:var(--muted);margin-top:4px}
.r-score{grid-area:s;display:flex;align-items:center;gap:8px}
.r-score .num{font-size:22px;min-width:54px;text-align:center}
.r-venue{grid-area:v;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r-res{grid-area:r;font-size:13px;font-weight:700;text-align:center;border-radius:999px;padding:2px 0}
.r-res.W{background:var(--win);color:#fff}.r-res.L{background:var(--loss);color:#fff}.r-res.T{background:var(--tie);color:#fff}
.r-res.live{border:1.5px dashed var(--muted);color:var(--muted);font-weight:500;font-size:10px;padding:3px 0}
.empty{color:var(--muted);text-align:center;padding:32px 12px}
.textbtn{border:0;background:none;color:var(--muted);text-decoration:underline;font-size:14px;padding:8px}

/* form */
.fs{margin:18px 0 0}
.fs > h2{font-family:var(--serif);font-weight:400;font-size:20px;margin:0 0 10px}
.field{display:block;margin-bottom:10px}
.field > span{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
input,select,textarea{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:11px 12px;font-size:16px;min-height:46px}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.custom{display:grid;grid-template-columns:70px 1fr;gap:6px;margin-top:6px}
.emo{text-align:center}
.match{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.lbl{font-size:12px;color:var(--muted);margin-bottom:4px}
.team-row{display:grid;grid-template-columns:auto 1fr 124px;gap:10px;align-items:end;padding-bottom:12px;margin-bottom:12px;border-bottom:1px dashed var(--line)}
.team-row .badge{margin-bottom:8px}
.stepper{display:grid;grid-template-columns:34px 1fr 34px;align-items:center;background:var(--bg);border-radius:10px;height:54px}
.stepper button{border:0;background:none;font-size:22px;height:100%;color:var(--muted)}
.stepper input{border:0;background:none;text-align:center;font-family:var(--serif);font-size:34px;padding:0;min-height:0}
.status{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.hr-row{display:grid;grid-template-columns:1fr 80px 60px 38px;gap:6px;margin-bottom:6px}
.x{border:0;background:var(--chip);border-radius:10px;font-size:18px}
.link-btn{border:1px dashed var(--line);background:none;border-radius:10px;padding:10px;width:100%;color:var(--muted)}
.cost{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cost label{display:flex;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:0 10px}
.cost label span{font-size:14px;color:var(--muted);white-space:nowrap}
.cost label input{border:0;background:none;text-align:right;min-height:44px;padding:8px 0 8px 8px}
.total{text-align:right;color:var(--muted);font-size:14px;margin-top:6px}
.primary-btn{width:100%;border:0;background:var(--ink);color:var(--bg);font-weight:700;font-size:17px;border-radius:12px;padding:14px;margin-top:22px}
.err{color:var(--loss);font-size:14px;margin-top:8px;min-height:1em}
.wchips{display:flex;flex-wrap:wrap;gap:6px}

/* detail */
.dhead{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px 14px;text-align:center}
.dhead .meta{font-size:13px;color:var(--muted)}
.dscore{display:flex;justify-content:center;align-items:center;gap:12px;margin:12px 0 2px}
.dteam{display:flex;flex-direction:column;align-items:center;gap:6px;width:92px;font-size:14px}
.dscore .num{font-size:58px;line-height:1}
.dl{margin:14px 0 0;padding:0}
.dl div{display:grid;grid-template-columns:76px 1fr;gap:10px;padding:11px 2px;border-bottom:1px solid var(--line);font-size:15px}
.dl dt{color:var(--muted);font-size:14px}
.dl dd{margin:0}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px;font-size:16px}
.btn.danger{color:var(--loss)}
.btn.danger.armed{background:var(--loss);color:#fff;border-color:var(--loss)}
.btn.main{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:700}

/* stats */
.card{border-top:1px solid var(--ink);padding:14px 0 18px}
.hgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:6px}
.hcell{border:1px solid var(--line);border-radius:12px;padding:12px 4px;text-align:center}
.hcell .badge{width:40px;height:40px;border-radius:10px;font-size:19px}.hcell .badge.code{font-size:12px}
.hcell b{display:block;font-family:var(--serif);font-weight:400;font-size:30px;line-height:1.1;margin-top:6px}
.hcell span{font-size:12px;color:var(--muted)}.hcell.zero{opacity:.35}
.glh{display:flex;align-items:baseline;gap:8px;margin:14px 0 6px;font-size:15px}.glh span{font-size:12px;color:var(--muted)}
.glog{display:grid;grid-template-columns:1fr 1fr;gap:12px 10px}
.gl{display:flex;align-items:center;gap:4px}.gl .c{flex:1;text-align:center;line-height:1.25;min-width:0}
.gl .c small{display:block;font-size:10px;letter-spacing:.08em;color:var(--muted)}.gl .c b{display:block;font-family:var(--serif);font-weight:400;font-size:22px}
.gl .c i{display:block;font-style:normal;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card h2{font-family:var(--serif);font-weight:400;font-size:22px;margin:0 0 8px}
.tbl{width:100%;border-collapse:collapse;font-size:15px}
.tbl td{padding:8px 0;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl td.r{text-align:right;white-space:nowrap;padding-left:8px}
.tbl .num{font-size:20px}
.bar{height:5px;border-radius:3px;background:var(--chip);margin-top:5px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--team)}
.big{display:flex;gap:22px;flex-wrap:wrap}
.big b{display:block;font-family:var(--serif);font-weight:400;font-size:38px;line-height:1}
.big span{font-size:13px;color:var(--muted)}
.note{font-size:13px;color:var(--muted)}
.cta{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;border-radius:16px;padding:16px;background:var(--team);color:#fff;margin:4px 0 18px}
.cta b{font-family:var(--serif);font-weight:400;font-size:22px;display:block}
.cta span{font-size:13px;opacity:.85}
.recap-preview{display:block;width:min(100%,300px);margin:6px auto 14px;border-radius:14px;box-shadow:0 10px 30px rgba(31,27,22,.18);aspect-ratio:9/16;background:var(--chip)}
.range{display:grid;grid-template-columns:64px 1fr;align-items:center;gap:10px;margin-bottom:8px;font-size:14px;color:var(--muted)}
.range input{min-height:0;padding:0;border:0;background:none;accent-color:var(--team)}
.file-btn{display:block;text-align:center;border:1px dashed var(--muted);border-radius:12px;padding:14px;cursor:pointer}
.file-btn input{display:none}
.team-chip{display:inline-flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px 6px;margin:0 6px 6px 0}
.team-chip.primary{border-color:var(--ink)}
.team-chip .badge{width:24px;height:24px;border-radius:999px;font-size:12px}
.team-chip button{border:0;background:var(--chip);border-radius:999px;font-size:12px;padding:3px 9px}
.season{display:grid;grid-template-columns:1fr 70px auto 70px auto;gap:6px;align-items:center;margin-bottom:6px;font-size:14px}
.season input{text-align:center;padding:8px;min-height:40px}
.toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;z-index:40;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw}
.toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
</head>
<body>
<header class="top" id="top"></header>
<main class="wrap" id="main"></main>
<div class="selbar hide" id="selbar"></div>
<nav class="nav"><div class="nav-in">
  <button data-act="tab" data-v="sched" id="nav-sched">賽程</button>
  <button data-act="tab" data-v="log" id="nav-log">紀錄</button>
  <button data-act="tab" data-v="stats" id="nav-stats">統計</button>
</div></nav>
<div id="sheet"></div>
<div class="toast" id="toast" role="status"></div>
<datalist id="dl-players"></datalist>
<datalist id="dl-friends"></datalist>

<script>
const LS='kanzhan-log-v1';
const LEAGUES=[['cpbl','中職'],['npb','日職'],['mlb','美職'],['kbo','韓職'],['intl','國際賽'],['other','其他']];

function schedFor(lg){

function schedSeason(name,y){

function mdz(d){if(!d)return '';const[,m,dd]=d.split('-');return `${m}/${dd}`}
function wd(d){const x=parseD(d);return isNaN(x)?'':'週'+WD[x.getDay()]}

let ui={tab:'sched',view:'sched',lg:'cpbl',mode:'month',month:null,week:null,detailId:null,year:thisYear(),delArmed:false,sheet:null,unselArmed:false,clearArmed:false};

/* ---------- storage & migration ---------- */
function migrateGame(g){
  let ch=false;
  [g.away,g.home].forEach(t=>{if(t&&RENAME[t.n]){t.n=RENAME[t.n];t.e=tinfo(t.n).k;ch=true}});
  if(g.venue&&VFULL[g.venue]&&VFULL[g.venue]!==g.venue){g.venue=VFULL[g.venue];ch=true}
  if(g.venue==='京瓷'){g.venue='京セラドーム大阪';ch=true}
  return ch;
}
function migrateSettings(s){
  s.myTeams=(s.myTeams||[]).map(n=>RENAME[n]||n);
  const ns={};Object.entries(s.season||{}).forEach(([k,v])=>{const[y,t]=k.split('|');ns[`${y}|${RENAME[t]||t}`]=v});s.season=ns;return s;
}
function normSettings(s){return migrateSettings({myTeams:Array.isArray(s&&s.myTeams)?s.myTeams:['味全龍'],season:(s&&s.season&&typeof s.season==='object')?s.season:{}})}
function loadLocal(){try{const raw=localStorage.getItem(LS);if(raw){const o=JSON.parse(raw);if(Array.isArray(o.games)){games=o.games;games.forEach(migrateGame)}if(o.settings)settings=normSettings(o.settings);}}catch(e){}}
function saveLocal(){try{localStorage.setItem(LS,JSON.stringify({games,settings}))}catch(e){}}
async function initCloud(){
  if(!window.claude||typeof window.claude.use!=='function')return;
  try{
    const [d,u]=await Promise.all([claude.use('db'),claude.use('user')]);
    if(!d||!u)return;
    const id=await u.id();if(!id)return;
    cloud.col=d.collection('data/users/'+id);
    let migrated=false;
    cloud.col.onSnapshot(async snap=>{
      const gs=[];let st=null;
      snap.docs.forEach(doc=>{if(!doc.exists)return;const v=doc.data();if(doc.id==='settings')st=clone(v);else if(doc.id.startsWith('g_'))gs.push(clone(v));});
      if(!migrated&&!snap.metadata.fromCache){
        migrated=true;
        if(snap.empty&&games.length){
          for(const g of games){try{await cloud.col.doc(g.id).set(g)}catch(e){}}
          try{await cloud.col.doc('settings').set(settings)}catch(e){}
          return;
        }
      }
      const fix=gs.filter(migrateGame);
      cloud.on=true;games=gs;if(st)settings=normSettings(st);saveLocal();
      if(!['form','recap'].includes(ui.view))render();else applyTeamColor();
      if(!snap.metadata.fromCache)for(const g of fix){try{await cloud.col.doc(g.id).set(g)}catch(e){}}
    },()=>{cloud.on=false;});
  }catch(e){}
}
async function persistGame(g){saveLocal();if(!cloud.col)return;try{await cloud.col.doc(g.id).set(g)}catch(e){toast(e&&e.code==='quota_exceeded'?'雲端空間已滿，這筆只存在本機':'雲端儲存失敗，已先存在本機')}}
async function removeGame(id){saveLocal();if(!cloud.col)return;try{await cloud.col.doc(id).delete()}catch(e){toast('雲端刪除失敗，請稍後再試')}}
async function persistSettings(){saveLocal();if(!cloud.col)return;try{await cloud.col.doc('settings').set(settings)}catch(e){toast('設定未同步到雲端')}}

/* ---------- teams ---------- */
function teamMap(){const m=new Map();Object.values(TEAMS).flat().forEach(t=>m.set(t.n,t));games.forEach(g=>[g.away,g.home].forEach(t=>{if(t&&t.n&&!m.has(t.n))m.set(t.n,{n:t.n,k:t.e||t.n.slice(0,1),c:'#6E665A'})}));return m}
let TM=null;function tinfo(n){if(!TM)TM=teamMap();return TM.get(n)||{n,k:(n||'?').slice(0,1),c:'#6E665A'}}
function sname(n){return tinfo(n).s||n}
function badge(n,cls=''){const t=tinfo(n);const code=/^[A-Z]{2,4}$/.test(t.k);const dark=/^#0{6}$|^#0[0-3]/i.test(t.c);return `<span class="badge ${cls} ${code?'code':''} ${dark?'dark':''}" style="background:${t.c};color:${t.t||'#fff'}" aria-hidden="true">${esc(t.k)}</span>`}
function applyTeamColor(){const t=settings.myTeams[0];document.documentElement.style.setProperty('--team',t?tinfo(t).c:'#6E665A')}

/* ---------- logic ---------- */
function sideOf(g,t){return g.away&&g.away.n===t?'a':g.home&&g.home.n===t?'h':null}
function res(g,t){
  if(g.status!=='final')return null;const s=sideOf(g,t);if(!s)return null;
  const a=Number(g.as),h=Number(g.hs);if(g.as==null||g.hs==null||!Number.isFinite(a)||!Number.isFinite(h))return null;
  const m=s==='a'?a:h,o=s==='a'?h:a;return m>o?'W':m<o?'L':'T';
}
function myRes(g){for(const t of settings.myTeams){const r=res(g,t);if(r)return{t,r};}return null}
function sortAsc(a,b){return (a.date||'').localeCompare(b.date||'')||(a.created||0)-(b.created||0)}
function inYear(g,y){return y==='all'||(g.date||'').startsWith(y)}
function record(list,t){const r={W:0,L:0,T:0,seq:[]};list.slice().sort(sortAsc).forEach(g=>{const x=res(g,t);if(x){r[x]++;r.seq.push(x)}});return r}
function pctNum(W,L){const n=W+L;return n?W/n:null}
function fmtPct(p){return p==null?'—':p===1?'1.000':p.toFixed(3).replace(/^0/,'')}
function fmtDiff(d){if(d==null)return '—';const s=Math.abs(d).toFixed(3).replace(/^0/,'');return (d>=0?'+':'−')+s}
function streak(seq){if(!seq.length)return '—';const last=seq[seq.length-1];let n=0;for(let i=seq.length-1;i>=0&&seq[i]===last;i--)n++;return last==='T'?'和局':`${n} 連${RES_TXT[last]}`}
function luck(list,t,y){const r=record(list,t);const mine=pctNum(r.W,r.L);const s=settings.season[`${y}|${t}`]||schedSeason(t,y);const full=s?pctNum(+s.W||0,+s.L||0):null;return {mine,full,diff:mine!=null&&full!=null?mine-full:null}}
function costTotal(g){return COSTS.reduce((s,[k])=>s+(Number(g.cost&&g.cost[k])||0),0)}
function years(){const s=new Set(games.map(g=>(g.date||'').slice(0,4)).filter(Boolean));s.add(thisYear());return [...s].sort().reverse()}
function tally(arr){const m=new Map();arr.forEach(x=>{if(x)m.set(x,(m.get(x)||0)+1)});return [...m.entries()].sort((a,b)=>b[1]-a[1])}
const mkey=(date,h,a,n)=>`${date}|${h}|${a}${n?'|'+n:''}`;
function selMap(){const m=new Map();games.forEach(g=>{if(g.home&&g.away)m.set(mkey(g.date,g.home.n,g.away.n,g.gn),g)});return m}
function hasDetails(g){return !!(g.seat||(g.with||[]).length||(g.hr||[]).length||costTotal(g)||g.weather||g.temp!=null)}

function fillDatalists(){

/* ---------- schedule picker ---------- */
const SVIEW={};
function mlbTeam(){if(ui.mlbT===undefined)ui.mlbT=settings.myTeams.find(n=>TEAMS.mlb.some(x=>x.n===n))||'';return ui.mlbT}
function schedView(){
  const S=schedFor(ui.lg);if(ui.lg!=='mlb'||!mlbTeam())return S;const t=mlbTeam();
  if(SVIEW[t])return SVIEW[t];
  const list=S.list.filter(e=>e.hn===t||e.an===t),byDate={};list.forEach(e=>(byDate[e.date]=byDate[e.date]||[]).push(e));
  return SVIEW[t]={list,byDate,months:[...new Set(list.map(e=>e.date.slice(0,7)))].sort()};
}
function ensureNav(){
  const S=schedView();const cur=today().slice(0,7);
  if(!ui.month||!S.months.includes(ui.month))ui.month=S.months.includes(cur)?cur:S.months[S.months.length-1];
  if(!ui.week)ui.week=monday(S.byDate[today()]?today():(S.list.filter(e=>e.date<=today()).pop()||S.list[0]).date);
}
function winSide(e){if(e.hs==null||e.as==null)return null;return e.hs>e.as?'h':e.as>e.hs?'a':'t'}
function gcard(e,sm){
  const g=sm.get(mkey(e.date,e.hn,e.an,e.gn));const w=winSide(e);
  const ac=w==='h'?'lose':w==='a'?'win':'',hc=w==='a'?'lose':w==='h'?'win':'';
  const tg=[e.no?e.no.padStart(3,'0'):'',e.tag,e.gn?`雙重賽 G${e.gn}`:''].filter(Boolean).join(' ');
  return `<button class="gcard ${g?'sel':''}" data-act="pick" data-i="${e.i}" aria-pressed="${!!g}">
    ${badge(e.an,w==='h'?'off':'')}<span class="nm ${ac}">${esc(sname(e.an))}</span>
    <span class="sc">${e.as??'–'}<i>:</i>${e.hs??'–'}</span>
    <span class="nm r ${hc}">${esc(sname(e.hn))}</span>${badge(e.hn,w==='a'?'off':'')}
    <span class="meta"><span>${esc(tg)}${g?'　已選':''}</span><span>${esc(e.venue)}</span></span>
  </button>`;
}

    for(let i=0;i<7;i++){const ds=addDays(ws,i);const gs=S.byDate[ds]||[];
      html+=`<div class="day" id="d-${ds}"><div class="day-h"><b>${mdz(ds)}</b><span>${wd(ds)}</span></div>${gs.length?`<div class="gcards">${gs.map(e=>gcard(e,sm)).join('')}</div>`:`<div class="day-none">沒有比賽</div>`}</div>`;}

  }else{
    html+=`<div class="chips">${S.months.map(k=>`<button class="chip" data-act="jump" data-v="${k}">${+k.slice(5)}月</button>`).join('')}</div>`;
    S.months.forEach(k=>{const arr=S.list.filter(e=>e.date.startsWith(k));
      html+=`<div class="mhead" id="m-${k}"><b>${+k.slice(5)}月</b>${(()=>{const s=arr.filter(e=>sm.has(mkey(e.date,e.hn,e.an,e.gn))).length;return `<span>本月 ${arr.length} 場</span>${s?`<em>已選 ${s} 場</em>`:''}`})()}</div>`;
      const dates=[...new Set(arr.map(e=>e.date))];
      dates.forEach(ds=>{html+=`<div class="day" id="d-${ds}"><div class="day-h"><b>${mdz(ds)}</b><span>${wd(ds)}</span></div><div class="gcards">${S.byDate[ds].map(e=>gcard(e,sm)).join('')}</div></div>`});

function entryToGame(e){
  const now=Date.now();
  return {id:e.id,src:e.lg,date:e.date,league:e.lg,venue:e.venue,indoor:INDOOR.has(e.venue),away:{n:e.an,e:tinfo(e.an).k},home:{n:e.hn,e:tinfo(e.hn).k},...(e.gn?{gn:e.gn}:{}),as:e.as,hs:e.hs,extra:null,status:e.hs==null?'live':'final',mvp:e.mvp||'',wp:e.wp||'',lp:e.lp||'',sv:e.sv||'',hr:[],seat:'',with:[],weather:INDOOR.has(e.venue)?'dome':'',temp:null,cost:{},created:now,updated:now};

async function pick(i){

/* ---------- log ---------- */
function hero(list,y){
  const t=settings.myTeams[0];if(!t)return '';
  const r=record(list,t);const L=luck(list,t,y);
  const attended=list.filter(g=>g.status==='final').length;
  const label=y==='all'?'生涯':`${y} 年`;
  const others=settings.myTeams.slice(1).map(o=>{const x=record(list,o);return x.seq.length?`<span>${badge(o)}${x.W} 勝 ${x.L} 敗${x.T?` ${x.T} 和`:''}</span>`:''}).filter(Boolean);
  const head=r.seq.length?`進場 <em>${attended}</em> 場，<br>${esc(t)} ${r.W} 勝 ${r.L} 敗${r.T?` ${r.T} 和`:''}`:`${label}，<br>還在等<em>第一場</em>。`;
  return `<section class="hero" aria-label="進場戰績">
    <div class="hero-team">${badge(t)}<span>${label}進場戰績</span></div>
    <h2>${head}</h2>
    <div class="stats-row">
      <div><b>${fmtPct(L.mine)}</b><span>進場勝率</span></div>
      <div><b>${fmtPct(L.full)}</b><span>全季勝率</span></div>
      <div><b class="${L.diff==null?'':L.diff>=0?'up':'down'}">${fmtDiff(L.diff)}</b><span>幸運指數</span></div>
      <div><b>${streak(r.seq)}</b><span>目前</span></div>
    </div>
    ${r.seq.length?`<div class="dots">${r.seq.map(x=>`<i class="dot ${x}" title="${RES_TXT[x]}"></i>`).join('')}</div><div class="legend">每個圓點是一場，實心為勝</div>`:''}
    ${others.length?`<div class="subrec">${others.join('')}</div>`:''}
  </section>`;
}
function renderLog(){
  setTop(`<h1>觀戰簿</h1><button class="icon-btn" data-act="manual">＋ 其他比賽</button><button class="icon-btn" data-act="go" data-view="settings" aria-label="設定">⚙︎</button>`);
  const yr=thisYear();
  const sorted=games.slice().sort(sortAsc).reverse();
  let html=hero(games.filter(g=>inYear(g,yr)),yr);
  if(!sorted.length)html+=`<p class="empty">還沒有紀錄。<br>到「賽程」點你看過的比賽就好。</p>`;
  let lastKey='';
  sorted.forEach(g=>{
    const key=(g.date||'').slice(0,7);
    if(key!==lastKey){const[y,m]=key.split('-');const n=sorted.filter(x=>(x.date||'').startsWith(key)).length;html+=`<div class="month">${+m} 月<small>${y}　${n} 場</small></div>`;lastKey=key;}
    const r=myRes(g);const live=g.status!=='final';
    const sub=[esc(g.venue),g.mvp?`MVP ${esc(g.mvp)}`:'',(g.with||[]).length?`與 ${esc(g.with.join('、'))}`:''].filter(Boolean).join('　');

function readTeam(side){const v=$(`#f-${side}`).value;if(v!=='__c')return {n:v,e:tinfo(v).k};return {n:$(`#f-${side}-n`).value.trim(),e:$(`#f-${side}-e`).value.trim()}}
function numOrNull(v){v=String(v??'').trim();if(v==='')return null;const n=Number(v);return Number.isFinite(n)?n:null}

async function save(){
  const g=collect();
  if(!g.src){
    const err=!g.date?'請選日期':!g.venue?'請填球場':!g.away.n||!g.home.n?'請填兩隊隊名':g.away.n===g.home.n?'兩隊不能是同一隊':g.status==='final'&&(g.as==null||g.hs==null)?'比賽結束要填上比分':'';
    if(err){$('#f-err').textContent=err;return}
  }
  const now=Date.now();
  if(!g.id){g.id='g_'+now.toString(36)+Math.random().toString(36).slice(2,6);g.created=now}
  g.updated=now;

  draft=null;ui.view='detail';ui.detailId=saved.id;render();window.scrollTo(0,0);toast('已儲存');

}

function maxRun(seq,k){let m=0,c=0;seq.forEach(x=>{c=x===k?c+1:0;if(c>m)m=c});return m}
function homeVenues(){return {cpbl:VENUES.cpbl.map(v=>v[0]),npb:[...new Set(Object.values(NPB_HOME))],mlb:[...new Set(Object.values(MLB_HOME))],kbo:[...new Set(Object.values(KBO_HOME).map(i=>KBO_V[i]))]}}
function teamLeague(t){return ['cpbl','npb','mlb','kbo'].find(lg=>(TEAMS[lg]||[]).some(x=>x.n===t))}
function schedIndex(){if(schedIndex.m)return schedIndex.m;const m=new Map();['cpbl','npb','mlb','kbo'].forEach(lg=>schedFor(lg).list.forEach(e=>m.set(e.id,e)));return schedIndex.m=m}

function cpblHalf(y){const ns=schedFor('cpbl').list.filter(e=>e.date.startsWith(y)&&!e.tag).map(e=>+e.no||0);return Math.ceil(Math.max(0,...ns)/2)}
function renderStats(){
  setTop(`<h1>統計</h1><button class="icon-btn" data-act="go" data-view="settings" aria-label="設定">⚙︎</button>`);
  const ys=years();const y=ui.year;
  const list=games.filter(g=>inYear(g,y));const fin=list.filter(g=>g.status==='final');const t=settings.myTeams[0];
  let html=`<div class="chips">${ys.map(v=>`<button class="chip" data-act="year" data-y="${v}" aria-pressed="${y===v}">${v}</button>`).join('')}<button class="chip" data-act="year" data-y="all" aria-pressed="${y==='all'}">全部</button></div>`;
  html+=hero(list,y);
  if(!fin.length){$('#main').innerHTML=html+`<p class="empty">這段期間還沒有比賽。</p>`;return}
  if(y!=='all')html+=`<button class="cta" data-act="go" data-view="recap"><div style="flex:1"><b>做成 ${y} 賽季回顧圖</b><span>放一張這季最喜歡的照片，存成直式圖片</span></div><span style="font-size:22px">›</span></button>`;

  html+=`<div class="card"><div class="big"><div><b>${fin.length}</b><span>場比賽</span></div><div><b>${venues.size}</b><span>座球場</span></div><div><b>${hrs.length}</b><span>支全壘打</span></div></div></div>`;
  const groupRec=keyFn=>{const m=new Map();fin.forEach(g=>{[].concat(keyFn(g)).filter(Boolean).forEach(k=>{if(!m.has(k))m.set(k,{n:0,W:0,L:0,T:0});const o=m.get(k);o.n++;const x=t&&res(g,t);if(x)o[x]++;})});return [...m.entries()].sort((a,b)=>b[1].n-a[1].n)};
  const recCell=o=>(o.W+o.L+o.T)?`${o.W} 勝 ${o.L} 敗${o.T?` ${o.T} 和`:''}`:'<span class="note">無主隊出賽</span>';
  const pctCell=o=>{const p=pctNum(o.W,o.L);return p!=null?fmtPct(p):'—'};
  // 主要球隊戰績細項
  if(t){const tg=fin.map(g=>({g,sd:sideOf(g,t),r:res(g,t)})).filter(x=>x.sd&&x.r);
    if(tg.length){const agg=a=>{const o={W:0,L:0,T:0};a.forEach(x=>o[x.r]++);return o};
      const h=agg(tg.filter(x=>x.sd==='h')),a=agg(tg.filter(x=>x.sd==='a'));
      const opp=new Map();tg.forEach(x=>{const n=x.sd==='h'?x.g.away.n:x.g.home.n;if(!opp.has(n))opp.set(n,[]);opp.get(n).push(x)});
      const lgTeams=(TEAMS[teamLeague(t)]||[]).map(x=>x.n);const oppList=[...opp.entries()].sort((p,q)=>{const i=lgTeams.indexOf(p[0]),j=lgTeams.indexOf(q[0]);return (i<0?99:i)-(j<0?99:j)||q[1].length-p[1].length});
      const mg=x=>{const f=+(x.sd==='h'?x.g.hs:x.g.as),o=+(x.sd==='h'?x.g.as:x.g.hs);return {f,o,d:f-o}};
      const pickMax=r=>tg.filter(x=>x.r===r).reduce((m,x)=>{if(!m)return x;const a1=Math.abs(mg(x).d),a2=Math.abs(mg(m).d);return a1>a2||(a1===a2&&mg(x).f+mg(x).o>mg(m).f+mg(m).o)?x:m},null);
      const bigRow=(lbl,x)=>{if(!x)return '';const g=x.g,w=winSide({hs:+g.hs,as:+g.as});return `<tr><td class="note" style="width:52px">${lbl}</td><td>${badge(g.away.n,'sm '+(w==='h'?'off':''))} <span class="num">${g.as} : ${g.hs}</span> ${badge(g.home.n,'sm '+(w==='a'?'off':''))}</td><td class="r note">${mdz(g.date)} ${esc(vshort(g.venue))}</td></tr>`};
      const hp=o=>{const p=pctNum(o.W,o.L);return p!=null?` <span class="note">${fmtPct(p)}</span>`:''};
      html+=`<div class="card"><h2>${esc(t)} 戰績細項</h2><table class="tbl">
        <tr><td class="note" style="width:52px">主場</td><td>${esc(sname(t))}當主隊</td><td class="r">${recCell(h)}${hp(h)}</td></tr>
        <tr><td class="note">客場</td><td>${esc(sname(t))}當客隊</td><td class="r">${recCell(a)}${hp(a)}</td></tr>
        ${oppList.map(([n,xs])=>`<tr><td>${badge(n)}</td><td>對${esc(sname(n))}</td><td class="r">${recCell(agg(xs))}</td></tr>`).join('')}
        ${bigRow('最大勝',pickMax('W'))}${bigRow('最大敗',pickMax('L'))}</table></div>`;}}
  // 比分：以主要球隊的角度
  const mine=t?fin.map(g=>{const sd=sideOf(g,t);const a=Number(g.as),h=Number(g.hs);if(!sd||g.as==null||g.hs==null||!Number.isFinite(a)||!Number.isFinite(h))return null;return {g,f:sd==='a'?a:h,o:sd==='a'?h:a}}).filter(Boolean):[];

  }

    html+=`<div class="card"><h2>看過分數最多的一場</h2><div class="dscore" style="margin:6px 0"><div class="dteam">${badge(b.away.n)}${esc(sname(b.away.n))}</div><span class="num" style="font-size:34px">${b.as}:${b.hs}</span><div class="dteam">${badge(b.home.n)}${esc(sname(b.home.n))}</div></div><p class="note" style="margin:0;text-align:center">${esc(b.date)} ${wd(b.date)}　${esc(b.venue)}　兩隊合計 ${+b.as+ +b.hs} 分</p></div>`;}
  // 福星：進場與沒進場的比較（只算賽程裡的例行賽）

  if(tl){const ids=new Set(games.filter(g=>g.status==='final').map(g=>g.id));const inn={W:0,L:0,T:0},out={W:0,L:0,T:0};

function hexRgb(h){h=(h||'#6E665A').replace('#','');if(h.length===3)h=h.split('').map(c=>c+c).join('');const n=parseInt(h,16);return [n>>16&255,n>>8&255,n&255]}

function recapData(y,mode){

    const rec={W:0,L:0,T:0};const per=new Map();seq.forEach(x=>{if(!x.t)return;rec[x.r]++;if(!per.has(x.t))per.set(x.t,{W:0,L:0,T:0});per.get(x.t)[x.r]++});
    const order=settings.myTeams.filter(t=>per.has(t));
    return {mode,fin,lgc,venues,teams,months,seq,rec,per,order,bestW:maxRun(seq.filter(x=>x.t).map(x=>x.r),'W')};

  if(mode==='year'){
    if(D.order.length){const items=D.order.map(t=>{const o=D.per.get(t);return [t,`${sname(t)} ${o.W}-${o.L}${o.T?`-${o.T}`:''}`]});
      let fs=36,tot;do{ctx.font=F(500,fs);tot=items.reduce((w,[,txt])=>w+28+ctx.measureText(txt).width+40,-40);if(tot<=CW)break;fs-=2}while(fs>22);
      let x=M;items.forEach(([t,txt])=>{const c=accentOf(tinfo(t));ctx.fillStyle=c;rr(ctx,x,yy-fs*.78,fs*.66,fs*.66,5);ctx.fill();x+=fs*.66+12;ctx.font=F(500,fs);ctx.fillStyle=GREY;ctx.fillText(txt,x,yy);x+=ctx.measureText(txt).width+40});}
    else seg([[`今年進場 ${D.fin.length} 場，還沒有支持球隊出賽的比賽`,0]]);}
  else{const L=D.L;if(L.diff!=null)seg([['全季勝率 ',0],[fmtPct(L.full),1],[`，我進場時${L.diff>=0?'高':'低'}了 `,0],[(Math.abs(L.diff)*100).toFixed(1),1],[' 個百分點',0]]);else seg([[`今年看了 ${D.lt.length} 場${sname(team)}的比賽`,0]]);}
  // visual strip
  yy+=40;shadowOff();
  if(mode==='year'){const sz=dotSz,gap=8,per=dotPer;const show=D.seq.slice(-per*3);const lw=Math.max(2,Math.round(sz/9));
    show.forEach((x,i)=>{const px=M+(i%per)*(sz+gap),py=yy+Math.floor(i/per)*(sz+gap);const r=Math.max(3,sz/5);
      if(!x.t){ctx.fillStyle='rgba(247,243,236,.12)';rr(ctx,px+sz*.3,py+sz*.3,sz*.4,sz*.4,2);ctx.fill();return}
      const c=accentOf(tinfo(x.t));
      if(x.r==='W'){ctx.fillStyle=c;rr(ctx,px,py,sz,sz,r);ctx.fill()}
      else{ctx.strokeStyle=c;ctx.lineWidth=lw;rr(ctx,px+lw/2,py+lw/2,sz-lw,sz-lw,r);ctx.stroke();if(x.r==='T'){ctx.fillStyle=c;rr(ctx,px+sz*.32,py+sz*.32,sz*.36,sz*.36,2);ctx.fill()}}});
    yy+=dotRows*(sz+gap)+60;}
  else{const seq=D.r.seq;const sz=30,gap=8,per=Math.floor((CW+gap)/(sz+gap));const show=seq.slice(-per*2);
    show.forEach((s,i)=>{const x=M+(i%per)*(sz+gap),y2=yy+Math.floor(i/per)*(sz+gap);ctx.fillStyle=s==='W'?AC:s==='L'?'rgba(247,243,236,.22)':'rgba(0,0,0,0)';rr(ctx,x,y2,sz,sz,6);ctx.fill();if(s==='T'){ctx.strokeStyle='rgba(247,243,236,.5)';ctx.lineWidth=3;ctx.stroke()}});
    yy+=(show.length>per?2:1)*(sz+gap)+60;}
  // stats row
  shadowOn();
  const stats=mode==='year'?[['進場',String(D.fin.length),'場'],['球場踩點',String(D.venues.length),'座'],['最長',String(D.bestW),'連勝']]
    :[['進場',String(D.lt.length),'場'],['球場踩點',String(D.venues),'座'],['最長',String(D.bestW),'連勝']];
  const cw=CW/3;stats.forEach(([l,v,u],i)=>{const x=M+i*cw+(i?36:0);if(i){shadowOff();ctx.fillStyle='rgba(247,243,236,.25)';ctx.fillRect(M+i*cw,yy-34,2,130);shadowOn();}
    ctx.fillStyle=GREY;ctx.font=F(500,30);ctx.fillText(l,x,yy);ctx.fillStyle=WHITE;ctx.font=F(700,84);ctx.fillText(v,x,yy+92);const vw=ctx.measureText(v).width;ctx.font=F(700,32);ctx.fillText(u,x+vw+10,yy+92);});
  // footer
  shadowOff();ctx.textAlign='center';ctx.font=F(700,30);ctx.fillStyle=GREY;ctx.fillText('觀戰簿',W/2,H-90);ctx.font=F(400,24);ctx.fillStyle=DIM;ctx.fillText(mode==='year'?'只計進場觀賽 · 不分聯盟':`只計進場觀賽 · ${team} 出賽的比賽`,W/2,H-50);
  ctx.textAlign='left';ctx.fillStyle=AC;ctx.fillRect(0,H-12,W,12);
}
function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
async function saveImage(){
  const cv=$('#rc');if(!cv)return;let dl=null;try{dl=window.claude&&await claude.use('downloads')}catch(e){}
  const blob=await new Promise(r=>cv.toBlob(r,'image/png'));if(!blob){toast('圖片產生失敗，請再試一次');return}
  const y=ui.year==='all'?thisYear():ui.year;
  if(!dl){// 不在 claude.ai 時：手機用分享選單（可存到照片），其他用一般下載
    const name=`${y}-${(ui.rcMode&&ui.rcMode!=='year')?ui.rcMode:'年度總覽'}-進場戰績.png`;
    try{const file=new File([blob],name,{type:'image/png'});if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file]});return}}catch(e){if(e&&e.name==='AbortError')return}
    const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000);return}
  try{await dl.save({filename:`${y}-${(ui.rcMode&&ui.rcMode!=='year')?ui.rcMode:'年度總覽'}-進場戰績.png`,data:blob})}catch(e){if(e&&e.code!=='declined')toast('儲存失敗，請稍後再試')}
}

/* ---------- settings ---------- */
function renderSettings(){
  setTop(`<button class="back" data-act="tab" data-v="${ui.tab}">‹ 返回</button><h1 style="text-align:center;font-size:20px">設定</h1><span style="width:56px"></span>`);
  const all=[...teamMap().values()].filter(t=>!settings.myTeams.includes(t.n));const t=settings.myTeams[0];
  $('#main').innerHTML=`
  <div class="card"><h2>支持的球隊</h2>
    <p class="note" style="margin:0 0 10px">勝敗以這些球隊計算，第一隊是主要球隊。</p>
    <div>${settings.myTeams.map((n,i)=>`<span class="team-chip ${i===0?'primary':''}">${badge(n)}${esc(n)}${i>0?`<button data-act="primary" data-n="${esc(n)}">設為主要</button>`:''}<button data-act="rmteam" data-n="${esc(n)}" aria-label="移除 ${esc(n)}">×</button></span>`).join('')}</div>
    <select id="add-team" data-chg="addteam" style="margin-top:8px"><option value="">＋ 加入球隊…</option>${all.map(x=>`<option value="${esc(x.n)}">${esc(x.n)}</option>`).join('')}</select>
  </div>
  ${t&&!schedSeason(t,thisYear())?`<div class="card"><h2>全季戰績</h2><p class="note" style="margin:0 0 10px">賽程資料裡沒有 ${esc(t)}，填入整季戰績才能算幸運指數。</p>
    ${years().map(y=>{const s=settings.season[`${y}|${t}`]||{};return `<div class="season"><span>${y}</span><input inputmode="numeric" data-chg="season" data-y="${y}" data-f="W" value="${s.W??''}" aria-label="${y} 勝場"><span>勝</span><input inputmode="numeric" data-chg="season" data-y="${y}" data-f="L" value="${s.L??''}" aria-label="${y} 敗場"><span>敗</span></div>`}).join('')}</div>`:''}
  <div class="card"><h2>資料</h2>
    <p class="note" style="margin:0 0 10px">${cloud.on?'紀錄已同步到你的帳號。':'目前紀錄只存在這個瀏覽器裡。'}共 ${games.length} 場。</p>
    <button class="btn" data-act="export" style="width:100%">匯出 CSV</button>
    <button class="btn danger ${ui.clearArmed?'armed':''}" data-act="clearall" style="width:100%;margin-top:8px">${ui.clearArmed?`確定刪除全部 ${games.length} 場？`:'清除所有紀錄'}</button>
  </div>`;
}
async function exportCsv(){
  const head=['日期','賽事','球場','客隊','客隊得分','主隊得分','主隊','MVP','勝投','敗投','救援','全壘打','座位','同行','天氣','氣溫',...COSTS.map(c=>c[1]),'花費合計'];
  const q=v=>{v=v==null?'':String(v);return /[",\n]/.test(v)?`"${v.replace(/"/g,'""')}"`:v};
  const rows=games.slice().sort(sortAsc).map(g=>[g.date,(LEAGUES.find(l=>l[0]===g.league)||[,''])[1],g.venue,g.away.n,g.as,g.hs,g.home.n,g.mvp,g.wp,g.lp,g.sv,(g.hr||[]).map(h=>`${h.p}${h.inn?`(${h.inn}局)`:''}`).join('、'),g.seat,(g.with||[]).join('、'),(WEATHER.find(w=>w[0]===g.weather)||[,,''])[2],g.temp,...COSTS.map(([k])=>g.cost&&g.cost[k]),costTotal(g)||'']);
  const csv='\ufeff'+[head,...rows].map(r=>r.map(q).join(',')).join('\n');
  let dl=null;try{dl=window.claude&&await claude.use('downloads')}catch(e){}
  if(!dl){toast('這個檢視無法下載檔案');return}
  try{await dl.save({filename:`觀戰簿-${today()}.csv`,data:csv})}catch(e){if(e&&e.code!=='declined')toast('匯出失敗，請稍後再試')}
}

/* ---------- events ---------- */
let toastT;
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),2200)}
function go(v){ui.view=v;ui.delArmed=false;ui.clearArmed=false;render();window.scrollTo(0,0)}

document.addEventListener('click',async e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  const a=b.dataset.act;
  if(a==='tab'){draft=null;ui.sheet=null;ui.tab=b.dataset.v;go(b.dataset.v)}
  else if(a==='go'){draft=null;go(b.dataset.view)}
  else if(a==='lg'){ui.lg=b.dataset.v;ui.month=null;ui.week=null;go('sched')}
  else if(a==='mode'){ui.mode=b.dataset.v;go('sched')}
  else if(a==='mnav'){const S=schedView();const i=S.months.indexOf(ui.month)+Number(b.dataset.d);if(S.months[i]){ui.month=S.months[i];renderSched()}}
  else if(a==='month'){ui.month=b.dataset.v;renderSched()}
  else if(a==='wnav'){ui.week=addDays(ui.week,Number(b.dataset.d));renderSched()}
  else if(a==='jump'){const el=document.getElementById('m-'+b.dataset.v);if(el)el.scrollIntoView({block:'start'})}
  else if(a==='pick'){pick(+b.dataset.i)}
  else if(a==='day'){const ds=b.dataset.v;ui.mode='week';ui.week=monday(ds);renderSched();const el=document.getElementById('d-'+ds);if(el)el.scrollIntoView({block:'start'})}
  else if(a==='closesheet'){ui.sheet=null;renderSheet()}
  else if(a==='unsel'){
    const g=games.find(x=>x.id===ui.sheet);if(!g)return;
    if(!ui.unselArmed){ui.unselArmed=true;renderSheet();return}
    games=games.filter(x=>x.id!==g.id);ui.sheet=null;ui.unselArmed=false;const y=window.scrollY;render();window.scrollTo(0,y);toast('已取消選取');await removeGame(g.id);
  }
  else if(a==='sheetedit'){const g=games.find(x=>x.id===ui.sheet);ui.sheet=null;if(g){draft=clone(g);go('form')}}
  else if(a==='manual'){draft=newDraft();go('form')}
  else if(a==='cancel'){const id=draft&&draft.id;draft=null;if(id){ui.detailId=id;go('detail')}else go(ui.tab)}
  else if(a==='detail'){ui.detailId=b.dataset.id;go('detail')}
  else if(a==='edit'){draft=clone(games.find(g=>g.id===b.dataset.id));go('form')}
  else if(a==='del'){
    if(!ui.delArmed){ui.delArmed=true;renderDetail();return}
    const id=b.dataset.id;games=games.filter(g=>g.id!==id);ui.delArmed=false;go('log');toast('已刪除');await removeGame(id);
  }
  else if(a==='league'){collect();const lg=b.dataset.lg;if(lg!==draft.league){draft.league=lg;const L=TEAMS[lg];if(L&&L.length){const mine=L.find(t=>settings.myTeams.includes(t.n))||L[0];const other=L.find(t=>t.n!==mine.n);draft.home={n:mine.n,e:mine.k};draft.away={n:other.n,e:other.k}}else{draft.home={n:'',e:''};draft.away={n:'',e:''}}draft.venue=(VENUES[lg][0]||[''])[0];}renderForm()}
  else if(a==='step'){const inp=$('#f-'+b.dataset.k);inp.value=Math.max(0,(numOrNull(inp.value)||0)+Number(b.dataset.d))}
  else if(a==='status'){collect();draft.status=b.dataset.s;renderForm()}
  else if(a==='weather'){collect();draft.weather=draft.weather===b.dataset.w?'':b.dataset.w;renderForm()}
  else if(a==='addhr'){$('#hr-list').insertAdjacentHTML('beforeend',hrRow());const ps=document.querySelectorAll('.hr-p');ps[ps.length-1].focus()}
  else if(a==='delhr'){b.closest('.hr-row').remove()}
  else if(a==='save'){save()}
  else if(a==='year'){ui.year=b.dataset.y;renderStats()}
  else if(a==='primary'){settings.myTeams=[b.dataset.n,...settings.myTeams.filter(n=>n!==b.dataset.n)];applyTeamColor();renderSettings();await persistSettings()}
  else if(a==='rmteam'){settings.myTeams=settings.myTeams.filter(n=>n!==b.dataset.n);applyTeamColor();renderSettings();await persistSettings()}
  else if(a==='export'){exportCsv()}
  else if(a==='clearall'){
    if(!ui.clearArmed){ui.clearArmed=true;renderSettings();return}
    const ids=games.map(g=>g.id);games=[];ui.clearArmed=false;renderSettings();toast('已清除');saveLocal();
    if(cloud.col)for(const id of ids){try{await cloud.col.doc(id).delete()}catch(e){}}
  }
  else if(a==='rcmode'){ui.rcMode=b.dataset.v;renderRecap()}
  else if(a==='rmphoto'){recap={img:null,zoom:1,x:50,y:50};renderRecap()}
  else if(a==='saveimg'){saveImage()}
});
document.addEventListener('change',async e=>{
  const el=e.target;const c=el.dataset.chg;
  if(c==='mlbteam'){ui.mlbT=el.value;ui.month=null;ui.week=null;renderSched();return}
  if(c==='team'){const side=el.id.slice(2);$(`#${el.id}-c`).classList.toggle('hide',el.value!=='__c');if(el.value==='__c')$(`#${el.id}-n`).focus();else $(`#b-${side}`).innerHTML=badge(el.value,'lg')}
  else if(c==='venue'){const ci=$('#f-venue-c');ci.classList.toggle('hide',el.value!=='__c');if(el.value==='__c')ci.focus();else if(INDOOR.has(el.value)&&!draft.weather){collect();draft.weather='dome';renderForm()}}
  else if(c==='addteam'&&el.value){settings.myTeams.push(el.value);applyTeamColor();renderSettings();await persistSettings()}
  else if(c==='season'){const t=settings.myTeams[0];const key=`${el.dataset.y}|${t}`;const s={...(settings.season[key]||{})};const n=numOrNull(el.value);if(n==null)delete s[el.dataset.f];else s[el.dataset.f]=Math.max(0,Math.round(n));if(Object.keys(s).length)settings.season[key]=s;else delete settings.season[key];await persistSettings();toast('已更新全季戰績')}
  else if(el.id==='rc-file'&&el.files&&el.files[0]){const rd=new FileReader();rd.onload=()=>{const im=new Image();im.onload=()=>{recap={img:im,zoom:1,x:50,y:50};renderRecap()};im.onerror=()=>toast('這張照片讀不出來，換一張試試');im.src=rd.result};rd.readAsDataURL(el.files[0])}
});
document.addEventListener('input',e=>{
  const el=e.target;
  if(el.dataset.chg==='cost'){let s=0;COSTS.forEach(([k])=>{s+=numOrNull($('#f-c-'+k).value)||0});$('#cost-total').textContent=`合計 ${s.toLocaleString()} 元`}
  else if(el.id==='rc-zoom'){recap.zoom=+el.value;drawRecap()}
  else if(el.id==='rc-x'){recap.x=+el.value;drawRecap()}
  else if(el.id==='rc-y'){recap.y=+el.value;drawRecap()}
});

loadLocal();
render();
initCloud();
</script>
